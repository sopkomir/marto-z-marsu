/* Marťo z Marsu. Tlačená obrazová kniha: modrotlač, červený Mars, vystrihovaný papier.
   Tri farby tlače plus papier, žiadne tiene ani prechody. */
:root{--ink:#1a2767;--milk:#fbfaf6;--poppy:#d6362b;--sun:#e8a925;--meadow:#2f7a5b;
 --sky:#cfe2ec;--orb:#d6362b;--far:#6f8fbd;--hill:#2f7a5b;--ground:#1a2767;--bg:#fbfaf6;--paper:#fbfaf6;--text:#1a2767;--soft:#2e3a73;--line:#1a2767;--accent:#d6362b;
 --limb:#1a2767;--disp:'Young Serif',Georgia,serif;--body:'Andika',system-ui,sans-serif}
body.l2{--sky:#efc258;--far:#c2704a;--hill:#8a7a2f}
body.l3{--sky:#1a2767;--far:#2d3d8f;--hill:#232f7c;--ground:#0f1747;--bg:#1a2767;--paper:#1a2767;--text:#fbfaf6;--soft:#c9d1ee;--line:#fbfaf6;--accent:#e8a925;--limb:#fbfaf6}
.night{--limb:#fbfaf6;--sky:#1a2767;--far:#2d3d8f;--hill:#232f7c;--ground:#0f1747;--orb:#d6362b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:19px;line-height:1.45;overflow-x:hidden;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--poppy);outline-offset:3px}
body.l3 :focus-visible{outline-color:var(--sun)}
.ic{width:24px;height:24px;display:block}
h1,h2,h3,p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 48px}

/* hlavička */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:2px;padding:6px 12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:21px;margin-right:auto;min-height:44px}
.brand svg{width:28px;height:28px;display:block}
.tb{width:46px;height:46px;display:grid;place-items:center;color:var(--text)}

/* titulka: jeden plagát */
.hero{position:relative;height:clamp(290px,62vw,470px);overflow:hidden;margin:0 -18px}
.scene{position:absolute;inset:0;width:100%;height:100%}
.sky-stars{display:none}body.l3 .sky-stars,.night .sky-stars{display:block}
.hero .hupko{position:absolute;left:24%;bottom:7%;width:clamp(104px,22vw,170px);transform:translateX(-50%)}
.title{font-family:var(--disp);font-weight:400;font-size:clamp(46px,11vw,84px);line-height:1;margin-top:26px;letter-spacing:-.01em}
.sub{font-size:21px;margin-top:6px;color:var(--accent)}
.lead{margin-top:18px;max-width:34em;font-size:20px}
.note{margin-top:12px;color:var(--soft);font-size:17px}
.sec{margin-top:42px}
.sec h2{font-family:var(--disp);font-weight:400;font-size:30px;margin-bottom:12px}

/* úrovne: riadky ako v obsahu knihy */
.lvls{border-top:2px solid var(--line)}
.lvl{display:grid;grid-template-columns:58px 1fr;column-gap:14px;align-items:center;width:100%;padding:12px 0;text-align:left;border-bottom:2px solid var(--line)}
.lvl>span:first-child{grid-column:1;grid-row:1/span 3}
.lvl svg{width:56px;height:56px;display:block}
.lvl b{grid-column:2;font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.1}
.lvl span{font-size:16px;color:var(--soft);grid-column:2}
.lvl p{font-size:16px;grid-column:2;line-height:1.3}
.lvl[aria-pressed=true]{box-shadow:inset 0 -7px 0 var(--sun)}

/* mapa: pás modrotlače */
.bar{height:6px;background:color-mix(in srgb,var(--line) 18%,transparent);margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--poppy);transition:width .5s}
.stamp{position:absolute;top:-2px;left:68px;background:var(--meadow);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.stamp .ic{width:18px;height:18px}
.rad{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;background:var(--poppy);color:#fff;margin:0 -18px;width:calc(100% + 36px)}
.rad b{display:block;font-family:var(--disp);font-weight:400;font-size:24px}.rad span{font-size:17px}
.foot{margin-bottom:12px}

/* úvod kapitoly */
.intro{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.intro:before{content:'';position:absolute;inset:0;background:rgba(26,39,103,.9)}
.intro>div{position:relative;max-width:560px;width:100%}
.bignum{font-family:var(--disp);font-size:clamp(110px,30vw,180px);line-height:.95;color:var(--poppy)}
.intro h2{font-family:var(--disp);font-weight:400;font-size:36px;margin-top:4px}
.intro p{font-size:22px;margin-top:10px;opacity:0;filter:blur(6px);animation:sharp .7s forwards}
.intro p.learn{color:var(--sun)}
@keyframes sharp{to{opacity:1;filter:none}}

/* tlačidlá: papierové štítky */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:10px 26px;background:var(--poppy);color:#fff;font-size:21px;font-weight:700}
.btn:active{background:#b92a22}
.btn.alt{background:none;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn[disabled]{opacity:.5}
.btn.small{min-height:48px;font-size:17px;padding:6px 16px}
.mt{margin-top:18px}.center{text-align:center}

/* kapitola */
.chap{max-width:720px;margin:0 auto;padding:0 16px 28px}
.chhead{display:flex;align-items:center;gap:10px;margin-top:4px}
.chhead h2{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.1;flex:1}
.ring{width:40px;height:40px;display:block}
.gcard{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:17px;line-height:1.3;color:var(--soft)}
.gcard svg{width:42px;height:42px;flex:none;display:block}
.pills{display:flex;gap:4px;margin:10px 0 6px}
.pill{flex:1;height:5px;background:color-mix(in srgb,var(--line) 18%,transparent)}
.pill.on{background:var(--sun)}.pill.ok{background:var(--meadow)}
.task{position:relative;min-height:420px;padding-top:6px}
.talk{display:flex;align-items:center;gap:12px;min-height:112px}
.hupko{position:relative}
.talk .hupko{width:88px;flex:none}
.hupko-svg{width:100%;display:block;overflow:visible}
.bub{flex:1;display:flex;align-items:center;gap:8px;justify-content:space-between;font-family:var(--disp);font-size:clamp(27px,7vw,38px);line-height:1.12}
.bub small{display:block;font-family:var(--body);font-size:16px;color:var(--soft);margin-top:3px}
.say{flex:none;width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:var(--text)}
.hintline{font-size:18px;color:var(--soft);margin:4px 2px;min-height:24px}

/* Marťove nálady */
.wear,.h-mouth,.h-lids{display:none}
.m-smile{display:block}
.zones rect{fill:transparent;cursor:pointer}
.hupko.happy .m-smile,.hupko.oops .m-smile,.hupko.talk .m-smile{display:none}
.hupko.happy .m-open,.hupko.talk .m-open{display:block}
.hupko.oops .m-oops{display:block}
.hupko.sleep .h-lids{display:block}.hupko.sleep .h-eyes{display:none}
.hupko.happy .h-all,.hupko.jump .h-all{animation:hop .55s ease-in-out}
.hupko.oops .h-all{animation:shake .4s}
.hupko.clap .h-arm-l{animation:armL .3s 4 alternate}.hupko.clap .h-arm-r{animation:armR .3s 4 alternate}
.hupko.wave .h-arm-r{animation:armR .3s 5 alternate}
.hupko.stomp .h-all{animation:stomp .35s 3}
.hupko.turn .h-all{animation:spin .9s}
.hupko.sit .h-all{animation:sit 1.2s}
.h-all{transform-origin:100px 214px;transform-box:view-box}
.h-arm-l{transform-origin:34px 128px;transform-box:view-box}.h-arm-r{transform-origin:166px 128px;transform-box:view-box}
@keyframes hop{30%{transform:translateY(-22%)}60%{transform:translateY(0) scaleY(.94)}}
@keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes armL{to{transform:rotate(50deg)}}@keyframes armR{to{transform:rotate(-50deg)}}
@keyframes stomp{50%{transform:translateY(5%) scaleY(.9)}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes sit{40%,70%{transform:scaleY(.68)}}
@keyframes glow{50%{background:var(--sun)}}

/* výbery: kúsky papiera */
.grid{display:grid;gap:10px;margin-top:8px}
.grid.c2{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid.c4{grid-template-columns:repeat(4,1fr)}}
.pic{position:relative;background:#fff;color:var(--ink);padding:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:96px;box-shadow:inset 0 0 0 2px var(--ink);touch-action:none;user-select:none}
.grid.c4 .pic{aspect-ratio:4/3}
.pic:nth-child(odd){rotate:-.7deg}.pic:nth-child(even){rotate:.6deg}
.pic svg{width:100%;height:100%;max-height:150px;min-height:0;display:block;pointer-events:none}
.pic span{font-size:21px;font-weight:700;margin-top:2px}
.pic:active{background:#f1eee3}
.pic.hint{animation:glow 1s infinite}
.pic.good{background:#cfe6da}
.pic.nope{animation:shake .35s}
.pic.gone{visibility:hidden}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{min-height:84px;font-family:var(--disp);font-size:30px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.yn .y{background:var(--meadow)}.yn .n{background:var(--poppy)}
.yn .ic{width:30px;height:30px}
.showpic{width:min(170px,44vw);margin:8px auto 0;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);padding:12px;rotate:-.7deg}
.showpic svg{display:block;width:100%}

/* maľovanie */
.paintwrap{display:flex;gap:12px;align-items:center;justify-content:center}
.rocket{width:min(220px,54vw)}
.rocket [data-part]{cursor:pointer;transition:fill .2s}
.pal{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.pal button{width:58px;height:58px;border-radius:50%;overflow:hidden}
.pal button svg{display:block;width:100%;height:100%;transform:scale(1.3)}
.pal button[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--line)}

/* hviezdy */
.sky-box{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--ink);padding:10px;min-height:96px}
body.l3 .sky-box{background:#0f1747}
.sky-box button{width:62px;height:62px}.sky-box svg{width:100%;height:100%;display:block}
.sky-box button.gone{visibility:hidden}
.jar{margin:10px auto 0;width:min(280px,80%);min-height:80px;border:3px solid var(--line);border-top:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:6px}
.jar svg{width:40px;height:40px}
.cnt{text-align:center;font-family:var(--disp);font-size:30px;min-height:42px}

/* pexeso */
.px{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin-top:8px}
@media(min-width:640px){.px{grid-template-columns:repeat(4,1fr)}}
.card{aspect-ratio:1;background-color:var(--ink);background-image:var(--mdt);background-size:48px;color:var(--ink);padding:6px;display:flex;align-items:center;justify-content:center;min-height:84px}
body.l3 .card{box-shadow:inset 0 0 0 2px var(--milk)}
.card svg{width:100%;height:100%;display:none}.card span{display:none;font-size:20px;font-weight:700}
.card.open{background:#fff;background-image:none;box-shadow:inset 0 0 0 2px var(--ink)}.card.open svg,.card.open span{display:block}
.card.done{background:#cfe6da;background-image:none}

/* hlas */

/* dlaždice */
.line{min-height:62px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;margin-bottom:10px}
.tile{min-height:54px;padding:6px 14px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);font-family:var(--disp);font-size:23px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* telo a oblečenie */
.body-big{width:min(250px,60vw);margin:0 auto}
.body-row{display:flex;align-items:center;justify-content:center;gap:10px}
.dress-big{width:min(210px,46vw);flex:none}
.rack{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1;max-width:260px}
.rack .pic{min-height:76px;padding:6px}

/* koniec dňa */
.stampbig{font-family:var(--disp);font-size:38px;color:var(--accent);margin:8px 0 2px;animation:sharp .4s}
.mission{background:var(--ink);color:#fff;padding:20px;margin:10px -16px 0}
body.l3 .mission{box-shadow:0 0 0 2px var(--milk)}
.mission h3{font-family:var(--disp);font-weight:400;font-size:25px;color:var(--sun)}
.mission p{font-size:22px;margin-top:6px}
.tip{margin-top:12px;font-size:17px;color:var(--soft)}
.sleepy{position:relative;height:320px;margin:0 -16px;overflow:hidden}
.sleepy .hupko{position:absolute;left:24%;bottom:6%;width:124px;transform:translateX(-50%)}
.zzz{position:absolute;left:36%;top:30%;font-family:var(--disp);font-size:32px;color:#fff;animation:zz 2.6s infinite}
@keyframes zz{from{transform:translateY(14px);opacity:0}40%{opacity:1}to{transform:translateY(-30px);opacity:0}}

/* spodný panel */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(15,23,71,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fbfaf6;color:#1a2767;width:100%;max-width:720px;max-height:88dvh;overflow:auto;padding:18px;font-size:17px;line-height:1.45}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:27px}
.sheet h4{font-family:var(--disp);font-weight:400;font-size:21px;margin:18px 0 6px}
.sheet p{margin-top:6px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shead button{width:46px;height:46px;display:grid;place-items:center}
.gl{border-bottom:2px dotted currentColor;cursor:help;font:inherit;color:inherit}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,46%),1fr));gap:6px}
.wi{min-width:0}.wi span{min-width:0;overflow-wrap:anywhere}
.wi{display:flex;align-items:center;gap:8px;text-align:left;padding:6px;box-shadow:inset 0 0 0 2px #1a2767;min-height:60px;color:#1a2767;background:#fff}
.wi svg{width:42px;height:42px;flex:none}.wi b{display:block;font-family:var(--disp);font-weight:400;font-size:19px}.wi span{font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #c9cde0}
.sw{min-width:72px;min-height:44px;box-shadow:inset 0 0 0 2px #1a2767;font-weight:700;color:#1a2767;padding:0 10px}
.sw[aria-pressed=true]{background:#2f7a5b;color:#fff;box-shadow:none}
.gate{width:100%;min-height:76px;box-shadow:inset 0 0 0 2px #1a2767;position:relative;overflow:hidden;font-size:18px;font-weight:700;color:#1a2767;touch-action:none;user-select:none}
.gate i{position:absolute;inset:0 auto 0 0;width:0;background:#e8a925}
.gate.on i{width:100%;transition:width 2.5s linear}
.gate span{position:relative}
.prog{display:grid;grid-template-columns:1fr 60px;gap:4px 10px;align-items:center}
.pb{height:8px;background:#e4e5ee;overflow:hidden}.pb i{display:block;height:100%;background:#2f7a5b}

/* rádio */
.radio{position:fixed;inset:0;z-index:70;background:#0f1747;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.radio .ring-ear{width:170px;height:170px;border-radius:50%;background:var(--poppy)}
.radio p{font-family:var(--disp);font-size:30px;margin-top:22px;max-width:18em}

/* odlet */
.score{width:100%;border-collapse:collapse;margin-top:10px}.score td{padding:6px 2px;border-bottom:1px solid var(--line)}
.field{width:100%;min-height:52px;border:2px solid var(--line);background:#fff;color:#1a2767;padding:8px 12px;font:inherit}

#print{display:none}
@media print{
 body{background:#fff!important;color:#1a2767}#app,.top,.sheet,.intro{display:none!important}#print{display:block}
 .cert{border:3px solid #1a2767;padding:34px;text-align:center;font-family:var(--body)}
 .cert h1{font-family:var(--disp);font-weight:400;font-size:40px;overflow-wrap:anywhere}.cert .hupko-svg{width:170px;margin:10px auto}
 .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 .pcard{border:1px dashed #1a2767;aspect-ratio:1;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;break-inside:avoid;font-family:var(--body);font-size:18px}
 .pcard svg{width:78%}
}
/* ---- spoznávanie slov ---- */
.lstage{min-height:236px;display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:center}
.reveal{position:relative;width:min(210px,56vw);aspect-ratio:1;perspective:900px}
.reveal .face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.reveal .back{background-color:var(--ink);background-image:var(--mdt);background-size:60px}
body.l3 .reveal .back{box-shadow:inset 0 0 0 2px var(--milk)}
.reveal .front{background:#fff;box-shadow:inset 0 0 0 2px var(--ink);padding:16px;transform:rotateY(180deg)}
.reveal .front svg{width:100%;height:100%;display:block}
.reveal.open .back{transform:rotateY(180deg)}.reveal.open .front{transform:rotateY(0)}
.obs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.gob{position:relative;background:#fff;box-shadow:inset 0 0 0 2px var(--ink);padding:8px;aspect-ratio:1;overflow:hidden}
.gob svg{position:relative;width:100%;height:100%;display:block;filter:grayscale(1) contrast(.7) brightness(1.15);transition:filter .6s}
.gob:before{content:'';position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;border-radius:50%;background:var(--c,#ddd);opacity:.28;transform:translate(-50%,-50%) scale(0);transition:transform .6s}
.gob.lit svg{filter:none;animation:pop .45s}.gob.lit:before{transform:translate(-50%,-50%) scale(1)}
@keyframes pop{40%{transform:scale(1.14) rotate(-3deg)}}
.rail{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;min-height:56px}
.thumb{width:82px;min-height:96px;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);padding:5px 3px;animation:pop .35s;display:flex;flex-direction:column;align-items:center;gap:1px}
.thumb svg{width:44px;height:44px;display:block;flex:none}
.thumb b{font-size:14px;line-height:1.1}.thumb small{font-size:13px;line-height:1.1;overflow-wrap:anywhere}
.thumb.on{background:var(--sun);transform:translateY(-5px)}

.rowstars{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:60px}
.rowstars svg{width:50px;height:50px}
.addstar{width:104px;height:104px}.addstar svg{width:100%;height:100%;display:block;animation:pulse 1.4s ease-in-out infinite}
.dropstar{animation:drop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-70px) scale(.5) rotate(-40deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
.hl{fill:var(--sun);fill-opacity:.45;stroke:var(--sun);stroke-width:4;animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}

/* ---- Marťo žije ---- */
.h-eyes{transform-origin:100px 112px;transform-box:view-box;animation:blink 4.6s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.1)}}
.h-ant{transform-origin:100px 60px;transform-box:view-box;animation:ant 3.4s ease-in-out infinite}
@keyframes ant{50%{transform:rotate(7deg)}}
.h-pup{transition:transform .12s}
.hupko.talk .m-open{transform-origin:100px 152px;transform-box:view-box;animation:lip .24s ease-in-out infinite alternate}
@keyframes lip{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.hupko.nod .h-all{animation:nod .35s 3}@keyframes nod{50%{transform:rotate(0) translateY(5%)}}
.hupko.shakeno .h-all{animation:shake .32s 3}
.hupko.dance .h-all{animation:dance .64s ease-in-out infinite}@keyframes dance{25%{transform:rotate(-7deg) translateY(-4%)}75%{transform:rotate(7deg) translateY(-4%)}}
.hupko.look .h-all{animation:shake .9s}
.hupko.sleep .h-all{animation:breathe 3.4s ease-in-out infinite}@keyframes breathe{50%{transform:scaleY(.96)}}
.turn{animation:turn .32s ease-out}@keyframes turn{from{opacity:0;transform:translateX(26px)}}

/* ---- titulka: raketa pristane raz ---- */
.landing{position:absolute;left:46%;bottom:15%;width:clamp(44px,10vw,74px);animation:land 1.8s cubic-bezier(.2,.8,.3,1) both}
.landing svg{display:block;width:100%}
.landing .flame{animation:flame .16s infinite alternate;transform-origin:60px 150px;transform-box:view-box}
@keyframes flame{to{transform:scaleY(.6)}}
@keyframes land{from{transform:translateY(-420px) rotate(14deg)}80%{transform:translateY(0) rotate(0)}90%{transform:translateY(-6px)}}
.landing:not(.away) .flame{animation:flame .16s 9 alternate,gone .1s 1.7s forwards}@keyframes gone{to{opacity:0}}
.hero .hupko{animation:peek .6s 1.5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes peek{from{opacity:0;translate:0 30px}}
.scene>circle:first-of-type{animation:rise 1.6s ease-out both}@keyframes rise{from{transform:translateY(90px)}}
.liftoff{position:relative;height:300px;overflow:hidden;margin:0 -16px 12px}
.landing.away{left:46%;bottom:12%;width:64px;animation:lift 3s 1s ease-in both}
@keyframes lift{to{transform:translateY(-520px)}}
.bigt{font-family:var(--disp);font-weight:400;font-size:32px}
.big{font-size:22px}

/* ---- úvod dňa ---- */
.introart{position:relative;height:190px;overflow:hidden;margin-bottom:6px}
.introart .hupko{position:absolute;left:24%;bottom:6%;width:92px;animation:peek .6s .3s both}
.bignum{font-size:clamp(70px,16vw,110px)!important;position:absolute;right:6px;top:-6px;color:var(--milk)!important;line-height:1}

/* ---- riekanka, príbeh, list, písanie ---- */
.chantbox{margin-top:6px}
.cl{font-family:var(--disp);font-size:clamp(20px,5.2vw,26px);line-height:1.25;padding:5px 10px;color:var(--soft);transition:color .2s}
.cl.on{color:var(--ink);background:var(--sun)}
.page{min-height:330px}
.pagescene{display:flex;align-items:flex-end;justify-content:center;gap:14px;background:#cfe2ec;padding:14px;min-height:210px}
.tale{width:112px;--limb:#1a2767}
.pageart{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pageart svg{width:96px;height:96px}
.pagetext{font-family:var(--disp);font-size:clamp(25px,6.5vw,33px);line-height:1.15;margin-top:12px;text-align:center}
.letter{background:#fff;color:#1a2767;padding:18px 20px;box-shadow:inset 0 0 0 2px #1a2767;font-family:var(--disp);font-size:22px;margin-top:8px;rotate:-.5deg}
.letter p{margin:3px 0}
.spell{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:42px;height:54px;display:grid;place-items:center;font-size:30px;font-family:var(--body);color:color-mix(in srgb,var(--text) 62%,var(--bg));border-bottom:3px solid var(--line)}
.slot.ok{color:var(--text);font-weight:700;animation:pop .3s}
.tile.used{visibility:hidden}
.two{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.showpic.small{width:min(104px,28vw);padding:7px}
/* pexeso s otáčaním */
.card{position:relative;background:none!important;background-image:none!important;padding:0;box-shadow:none!important;perspective:600px}
.cface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .4s}
.cback{background-color:var(--ink);background-image:var(--mdt);background-size:48px}
body.l3 .cback{box-shadow:inset 0 0 0 2px var(--milk)}
.cfront{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);padding:7px;transform:rotateY(180deg)}
.cfront svg{width:100%;height:100%;display:block!important}.cfront em{font-style:normal;font-size:20px;font-weight:700}
.card.open .cback{transform:rotateY(180deg)}.card.open .cfront{transform:rotateY(0)}
.card.done .cfront{background:#cfe6da}
/* konfety a let */
.bit{position:fixed;width:9px;height:12px;z-index:90;pointer-events:none;animation:bit 1s ease-out forwards}
@keyframes bit{to{transform:translate(var(--x),calc(var(--y) + 240px)) rotate(var(--r));opacity:0}}
.flying{z-index:90;pointer-events:none;animation:fly .5s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.15) rotate(20deg);opacity:.4}}
.splash{animation:pop .4s}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.intro p{opacity:1;filter:none}}

/* Mapa: pokojné nebo bez vzoru, popisy na plných štítkoch, hrubá cesta */
.map{position:relative;overflow:hidden;background:#1a2767;margin:0 -18px}
body.l3 .map{box-shadow:0 0 0 2px var(--milk)}
.map svg.road{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-44px);width:164px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:none;border:0;padding:0;color:var(--ink)}
.stop .dot{position:relative;width:88px;height:88px;border-radius:50%;background:var(--milk);display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 5px #1a2767,0 0 0 8px #fbfaf6}
.stop .dot svg{width:62px;height:62px}
.stop b{font-size:17px;font-weight:700;line-height:1.2;background:var(--milk);color:#1a2767;padding:5px 10px;max-width:164px}
.stop.now .dot{background:var(--sun);box-shadow:0 0 0 5px #1a2767,0 0 0 9px #e8a925;animation:pulse 1.6s ease-in-out infinite}
.stop.now b{background:var(--sun)}
.stop.lock .dot{background:#d5daf0;box-shadow:0 0 0 5px #1a2767,0 0 0 8px #7f8ad2}
.stop.lock .dot svg{filter:grayscale(1) contrast(.75);opacity:.6}
.stop .stamp{position:absolute;top:56px;left:calc(50% + 18px);right:auto;width:34px;height:34px;border-radius:50%;background:var(--meadow);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #1a2767;transform:none}
.stop.lock .stamp{background:#1a2767;box-shadow:0 0 0 2px #fbfaf6}
.stop .stamp svg{width:19px;height:19px}
.walker{position:absolute;width:58px;transform:translate(calc(-100% - 40px),-50%);transition:left 1.3s ease-in-out,top 1.3s ease-in-out;z-index:3;pointer-events:none;--limb:#fbfaf6}
.stop:not(.lock) .dot .rocket [data-part=body]{fill:#fbfaf6}
.stop:not(.lock) .dot .rocket [data-part=nose],.stop:not(.lock) .dot .rocket [data-part^=wing]{fill:#d6362b}
.stop:not(.lock) .dot .rocket [data-part=door]{fill:#2f7a5b}
.stop:not(.lock) .dot .rocket [data-part=window]{fill:#e8a925}
.stop .dot .rocket{stroke-width:2}

/* Vedro s farbou: zatvorené sa kníše, po ťuknutí odletí veko a farba pretečie */
.can{width:150px;height:150px;padding:0;background:none;border:0;color:#1a2767;cursor:pointer;display:block;margin:0 auto}
body.l3 .can{color:#fbfaf6}
.can svg{width:100%;height:100%;display:block;overflow:visible}
.can:not(.open){animation:canwob 1.5s ease-in-out infinite;transform-origin:50% 90%}
.can .lid{transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .5s;transform-origin:70px 50px}
.can.open .lid{transform:translate(58px,-40px) rotate(32deg);opacity:0}
.can .drip{transform:scaleY(0);transform-origin:50% 52px;transition:transform .55s .15s cubic-bezier(.3,1.2,.5,1)}
.can.open .drip{transform:scaleY(1)}
@keyframes canwob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.can:not(.open){animation:none}}

.lvlnote{grid-column:1/-1;font-size:16px;color:var(--soft);margin:4px 2px 0}

/* Slovenský význam */
.bub small.gloss{font-size:21px;font-weight:700;color:var(--accent);margin-top:4px}
.cl small,.pagetext small{display:block;font-family:var(--body);font-size:16px;font-weight:400;color:var(--soft);line-height:1.25}
.pic small{display:block;font-size:15px;color:#2e3a73;line-height:1.1}
.cl.on small{color:var(--ink)}

</style>

const fnv=s=>{let h=0x811c9dc5;for(const x of new TextEncoder().encode(s)){h^=x;h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')};

function clipKeys(t,lang,slow){if(!REC.idx)return null;const n=S.name?t.split(', '+S.name).join(''):t,ks=[];for(const p of splitS(n)){if(!/[\p{L}\p{N}]/u.test(p))continue;const a=fnv(`${lang}|${slow?1:0}|${p}`),b=fnv(`${lang}|0|${p}`),k=REC.idx[a]?a:REC.idx[b]?b:null;if(!k)return null;ks.push(k)}return ks.length?ks:null}
function loadClip(h){if(REC.buf.has(h))return REC.buf.get(h);const[fi,off,len]=REC.idx[h],url='audio/'+REC.files[fi];
 const raw=REC.bin[fi]?Promise.resolve(REC.bin[fi].slice(off,off+len)):fetch(url,{headers:{Range:`bytes=${off}-${off+len-1}`}}).then(async r=>{if(r.status===206)return r.arrayBuffer();if(r.ok){const all=await r.arrayBuffer();REC.bin[fi]=all;return all.slice(off,off+len)}throw 0});

 const h=makeMarto(),txt=el('div',{},'...'),rep=el('button',{cls:'say','aria-label':'Počuť znova',html:ic('replay')});
 const bub=el('div',{cls:'bub',role:'status'},txt,rep),hint=el('div',{cls:'hintline'},sk||'');
 box.append(el('div',{cls:'talk'},h,bub),hint);let last='';
 const talk=async(t,small,rate)=>{last=t;txt.innerHTML='';txt.append(t);const sub=small||api.sticky;if(sub)txt.append(el('small',{cls:api.sticky?'gloss':''},sub));mood(h,'talk',0);await say(t,'en',{rate});mood(h,null)};

 const api={h,talk,hint,sticky:null};return api}
/* Pokyn: prvé razy aj po slovensky, potom už stačí anglický. Slovenčina postupne ustupuje. */
async function guide(s,c,key,sk,en){const n=S.seen[key]||0;S.seen[key]=n+1;save();s.hint.textContent=sk;if(n<(c.L.id==='l1'?4:2))await say(sk,'sk');if(en)await s.talk(en)}
const whq=(c,x)=>typeof c.ch.wh==='function'?c.ch.wh(x):c.ch.wh;
const qOf=(h,x)=>(h.ask||h.examQ)(x);
const praise=async(s,from)=>{beep(true);mood(s.h,'happy');confetti(from);await s.talk(pick(QUIZ_YES))};
const poolN=c=>(c.ch.pool&&c.ch.pool[c.L.id])||c.L.pool;
const pool=c=>c.ch.words.slice(0,poolN(c));
const deck=(c,n)=>{const p=shuffle(pool(c)),o=[];while(o.length<n)o.push(p[o.length%p.length]);return o};
const others=(c,x,n)=>shuffle(pool(c).filter(v=>v!==x)).slice(0,n);
const optArt=(c,x,plain)=>!plain&&c.ch.opt?c.ch.opt(x):x.art;
function picBtn(x,c,fn,key){const b=el('button',{cls:'pic','aria-label':x.sk,html:art(key||x.art)});if(c.L.read)b.append(el('span',{},x.en));b.addEventListener('click',()=>fn(b));return b}

/* Výber z obrázkov. Chyba nie je trest: Marťo pomenuje, čo dieťa vybralo, a zopakuje otázku. */
function mc(s,c,x,q,once,plain){if(!once)gloss(s,c,x);return new Promise(res=>{const opts=shuffle([x,...others(c,x,c.L.choices-1)]);const g=el('div',{cls:'grid c'+Math.min(opts.length,4)});let n=0,lock=false,rightEl;const task=s.h.closest('.task');
 opts.forEach(o=>{const b=picBtn(o,c,async b=>{if(lock)return;if(o===x){lock=true;b.classList.add('good');mark(x,n===0);await praise(s,b);res(n===0)}else if(once){lock=true;mark(x,false);beep(false);mood(s.h,'oops');rightEl.classList.add('good');await s.talk(cap(x.en)+'!');res(false)}else{n++;lock=true;b.classList.add('nope');setTimeout(()=>b.classList.remove('nope'),400);beep(false);mood(s.h,'oops');s.hint.textContent=`Hľadáme: ${x.sk}`;await s.talk(cap(o.en)+'. '+q,o.sk);lock=false;if(n>1){rightEl.classList.add('hint');s.hint.textContent=`Hľadáme: ${x.sk}. Pozri, čo svieti.`}}},optArt(c,o,plain));if(o===x){rightEl=A(b)}g.append(b)});
 task.append(g)})}

/* Predmet letí k Marťovi */
function flyTo(b,target){if(!onlyMe()){b.classList.add('gone');return}const r=b.getBoundingClientRect(),t=target.getBoundingClientRect();const g=b.cloneNode(true);g.removeAttribute('data-a');g.className='pic flying';g.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;--dx:${t.left+t.width/2-r.left-r.width/2}px;--dy:${t.top+t.height/2-r.top-r.height/2}px`;document.body.append(g);b.classList.add('gone');setTimeout(()=>g.remove(),520)}

/* Ťahanie: funguje myšou aj prstom, ťuknutie zostáva ako náhrada */
function drag(b,target,fn){let sx,sy,on=false;
 b.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;on=true;try{b.setPointerCapture(e.pointerId)}catch(x){}});
 b.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>10)b.dataset.drag='1';if(b.dataset.drag){b.style.transform=`translate(${dx}px,${dy}px) scale(.8)`;b.style.zIndex=5}});
 const end=e=>{if(!on)return;on=false;b.style.transform='';b.style.zIndex='';if(b.dataset.drag){const r=target.getBoundingClientRect();if(e.clientX>r.left-24&&e.clientX<r.right+24&&e.clientY>r.top-24&&e.clientY<r.bottom+24)fn()}};
 b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end)}
